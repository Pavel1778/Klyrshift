name: Release

on:
  push:
    # Only real release tags (``v0.2.0``) publish a release; stage tags such as
    # ``stage-1`` must not, or the release would ship the previous version's
    # ``.deb`` under a stage name.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Hotfix tags (``v0.2.8.1``) also publish a release.
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build .deb and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          python -m pip install --upgrade pip build

      - name: Build .deb
        run: bash scripts/build_deb.sh

      - name: Smoke-test the .deb in a clean Debian container
        run: bash scripts/smoke_test.sh

      - name: Prove the .deb installs with no manual step (zero-config)
        run: bash scripts/deb_selfsufficiency_test.sh

      # The rename is the one change that can strand an existing user: the new
      # package must displace the old one and carry the settings across.
      - name: Upgrade from the pre-rename package
        run: bash scripts/upgrade_test.sh

      - name: Build source distribution
        run: python -m build --sdist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Stage dictionary assets
        run: |
          # Ship the frequency dictionaries as standalone release assets so they
          # can be downloaded directly (and so ``klyrshift dict download`` finds
          # them at the stable /releases/latest/download/<lang>-50k.txt URL).
          mkdir -p dist/dictionaries
          cp dictionaries/*-50k.txt dist/dictionaries/
          cp dictionaries/README.md dist/dictionaries/README.md

      - name: Stage thematic dictionary archives
        run: |
          # One archive per thematic category, so ``klyrshift dict install
          # <category>`` can fetch a single asset
          # (releases/latest/download/klyrshift-dict-<slug>.tar.gz) without the
          # whole repository. The archive keeps the category folder layout, so
          # the member name is ``<lang>-<slug>-1k.txt``.
          bash scripts/build_dict_archives.sh dist/dict-archives

      # Gate the publish on the tag, the tree version and the asset list agreeing.
      # The tag is cut by hand, so this is the last point at which a mismatch (a tag
      # for a version the tree does not carry, or an asset the workflow forgot to
      # attach) can be caught before the release is public. ``--tag`` checks the
      # pushed tag against the tree; the asset names are listed from the staged
      # files, so the check sees what this run will actually upload.
      - name: Check release consistency before publishing
        run: |
          set -euo pipefail
          {
            ls dist/*.deb dist/*.tar.gz
            ls dist/dictionaries/*-50k.txt
            ls dist/dict-archives/*.tar.gz
          } | xargs -n1 basename | sort -u > /tmp/staged-assets.txt
          echo "staged assets:"; cat /tmp/staged-assets.txt
          python3 scripts/release_consistency.py \
            --source --tag "${GITHUB_REF_NAME}" --assets-file /tmp/staged-assets.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/dictionaries/*-50k.txt
            dist/dict-archives/*.tar.gz
          generate_release_notes: true

      # After the release exists, prove the stable download URLs the landing page
      # and ``dict install`` use actually resolve. The pre-publish check compares
      # names; only a real request proves the assets are downloadable, and a
      # missing one is a 404 for every user of the "download latest" button.
      - name: Verify the published download links resolve
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if python3 scripts/release_consistency.py --tag "${GITHUB_REF_NAME}" --check-urls; then
              exit 0
            fi
            echo "attempt ${attempt} failed; the release may still be propagating"
            sleep 15
          done
          echo "::error::published download links did not resolve"
          exit 1
