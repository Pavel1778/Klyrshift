name: Release

on:
  push:
    # Only real release tags (``v0.2.0``) publish a release; stage tags such as
    # ``stage-1`` must not, or the release would ship the previous version's
    # ``.deb`` under a stage name.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Hotfix tags (``v0.2.8.1``) also publish a release.
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

# One release per tag, and never cancel one in flight: a half-cancelled publish
# could leave a release with a partial asset set. A retry of the same tag waits
# for the first to finish (and is then refused by the re-publish guard below).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build .deb and publish release
    # Pinned to 24.04: this job builds the *published* artifact, so its
    # toolchain must be fixed. It is the same image the ``package`` job in
    # ``ci.yml`` uses, so the artifact uploaded there and the one published here
    # are byte-identical for a given commit (the reproducible-build contract).
    # A moving ``ubuntu-latest`` could change the packaging toolchain between a
    # tag and the next one without a code change.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the tag's commit and its CI run can be resolved.
          fetch-depth: 0

      # Fail fast, before the (expensive) build, on the two conditions that make
      # a publish wrong: the tag was already published, or the tagged commit did
      # not pass CI. Both are cheaper to check here than to discover after the
      # release is public, and neither rewrites an existing release.
      - name: Refuse to re-publish an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::release ${GITHUB_REF_NAME} already exists; refusing to overwrite it"
            exit 1
          fi
          echo "no existing release for ${GITHUB_REF_NAME}; safe to publish"

      # The tag must point at a commit whose CI passed. ``ubuntu-latest`` in
      # ci.yml validates the code; publishing a tag whose commit is red would
      # ship an untested artifact. This queries the real Actions runs for the
      # tagged commit, so a green local run is not accepted as evidence.
      - name: Require a green CI run on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-list -n1 "${GITHUB_REF_NAME}")"
          echo "tagged commit: ${sha}"
          # Give CI a moment if the tag was pushed right after the merge.
          for attempt in $(seq 1 40); do
            conclusion="$(gh run list --workflow ci.yml --commit "${sha}" \
              --json conclusion,status --jq \
              'map(select(.status=="completed")) | .[0].conclusion // ""' 2>/dev/null || true)"
            case "${conclusion}" in
              success)
                echo "CI on ${sha}: success"
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure)
                echo "::error::CI on ${sha} concluded ${conclusion}; refusing to publish"
                exit 1
                ;;
            esac
            echo "attempt ${attempt}: CI not completed yet (conclusion='${conclusion}'); waiting"
            sleep 15
          done
          echo "::error::CI on ${sha} did not reach a successful conclusion in time"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          python -m pip install --upgrade pip build

      - name: Build .deb
        run: bash scripts/build_deb.sh

      # The published artifact must be reproducible from this tree: build it a
      # second time and require the identical sha256, on the same pinned image
      # the CI ``package`` job uses. This is what makes the checksum in
      # ``SHA256SUMS.txt`` (and the release notes) verifiable by a user who
      # rebuilds from the tagged commit.
      - name: Verify the build is byte-reproducible
        run: |
          set -euo pipefail
          first="$(sha256sum dist/klyrshift_*.deb | cut -d' ' -f1)"
          echo "first build:  ${first}"
          rm -rf dist build
          bash scripts/build_deb.sh >/dev/null
          second="$(sha256sum dist/klyrshift_*.deb | cut -d' ' -f1)"
          echo "second build: ${second}"
          if [ "${first}" != "${second}" ]; then
            echo "::error::the .deb is not reproducible: ${first} != ${second}"
            exit 1
          fi
          echo "reproducible: ${first}"

      - name: Smoke-test the .deb in a clean Debian container
        run: bash scripts/smoke_test.sh

      # Debian 13 is the current stable and the target the package is written
      # for (udev 73-seat-late.rules, systemd 257). Testing only on the older
      # Debian 12 would let a trixie-only regression ship, so both are run.
      - name: Smoke-test the .deb on Debian 13 (the target release)
        run: SMOKE_IMAGE=debian:13 bash scripts/smoke_test.sh

      - name: Prove the .deb installs with no manual step (zero-config)
        run: bash scripts/deb_selfsufficiency_test.sh

      # The rename is the one change that can strand an existing user: the new
      # package must displace the old one and carry the settings across.
      - name: Upgrade from the pre-rename package
        run: bash scripts/upgrade_test.sh

      - name: Build source distribution
        run: python -m build --sdist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Stage dictionary assets
        run: |
          # Ship the frequency dictionaries as standalone release assets so they
          # can be downloaded directly (and so ``klyrshift dict download`` finds
          # them at the stable /releases/latest/download/<lang>-50k.txt URL).
          mkdir -p dist/dictionaries
          cp dictionaries/*-50k.txt dist/dictionaries/
          cp dictionaries/README.md dist/dictionaries/README.md

      - name: Stage thematic dictionary archives
        run: |
          # One archive per thematic category, so ``klyrshift dict install
          # <category>`` can fetch a single asset
          # (releases/latest/download/klyrshift-dict-<slug>.tar.gz) without the
          # whole repository. The archive keeps the category folder layout, so
          # the member name is ``<lang>-<slug>-1k.txt``.
          bash scripts/build_dict_archives.sh dist/dict-archives

      # Gate the publish on the tag, the tree version and the asset list agreeing.
      # The tag is cut by hand, so this is the last point at which a mismatch (a tag
      # for a version the tree does not carry, or an asset the workflow forgot to
      # attach) can be caught before the release is public. ``--tag`` checks the
      # pushed tag against the tree; the asset names are listed from the staged
      # files, so the check sees what this run will actually upload.
      - name: Check release consistency before publishing
        run: |
          set -euo pipefail
          {
            ls dist/*.deb dist/*.tar.gz
            ls dist/dictionaries/*-50k.txt
            ls dist/dict-archives/*.tar.gz
          } | xargs -n1 basename | sort -u > /tmp/staged-assets.txt
          echo "staged assets:"; cat /tmp/staged-assets.txt
          python3 scripts/release_consistency.py \
            --source --tag "${GITHUB_REF_NAME}" --assets-file /tmp/staged-assets.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            dist/dictionaries/*-50k.txt
            dist/dict-archives/*.tar.gz
          generate_release_notes: true

      # After the release exists, prove the stable download URLs the landing page
      # and ``dict install`` use actually resolve. The pre-publish check compares
      # names; only a real request proves the assets are downloadable, and a
      # missing one is a 404 for every user of the "download latest" button.
      - name: Verify the published download links resolve
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if python3 scripts/release_consistency.py --tag "${GITHUB_REF_NAME}" --check-urls; then
              exit 0
            fi
            echo "attempt ${attempt} failed; the release may still be propagating"
            sleep 15
          done
          echo "::error::published download links did not resolve"
          exit 1
