name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run for the same ref is wasted work; cancel it. ``main`` is
# included so a force-push-free re-push of a branch does not pile up runs. The
# release workflow deliberately does NOT cancel (see release.yml).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runner policy (deliberate, not mechanical):
#   * Jobs that *build the .deb* (`package` here, `release.yml`) are pinned to
#     `ubuntu-24.04`: the packaging toolchain is part of what the reproducible
#     build fixes, and both jobs must produce the same bytes.
#   * The GUI job is pinned to `ubuntu-24.04` because it imports the
#     *distribution* PyGObject, whose ABI must match the test interpreter.
#   * Every other job stays on `ubuntu-latest` on purpose: it validates the
#     code, not the packaging toolchain, so running it on the newest image is an
#     early warning that the code still works on the next Ubuntu. Pinning it
#     would hide exactly the regression we want to see first.
jobs:
  lint-and-test:
    name: Lint & test (Python ${{ matrix.python-version }})
    # ubuntu-latest on purpose (see the runner policy above): this validates the
    # code on the newest Ubuntu, which is the signal we want first.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      # tests/test_demo_parity.py runs the landing-page demo's TypeScript logic
      # under Node and compares it with the detector; without Node it skips.
      # Node >= 23.6 executes TypeScript directly. "20" here made the harness
      # fail with ERR_UNKNOWN_FILE_EXTENSION on every Python version.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install evdev

      - name: Ruff
        run: ruff check .

      - name: isort
        run: isort --check-only .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy --strict .

      - name: Pytest
        run: pytest tests/ -q --cov=klyrshift --cov-report=term-missing --cov-fail-under=80

  gui:
    name: GUI (GTK4 under xvfb)
    # Pinned to 24.04 on purpose. The GUI tests import the *distribution*
    # PyGObject (``python3-gi``) from ``/usr/lib/python3/dist-packages`` because
    # building PyGObject from source needs ``girepository-2.0``, which the
    # Ubuntu dev packages do not provide. That distro ``gi`` is a compiled
    # extension built for the distro interpreter's ABI. When ``ubuntu-latest``
    # moved to 26.04 (Python 3.14) while ``setup-python`` still installed 3.12,
    # ``import gi`` failed, every GTK test skipped, the GUI modules dropped to
    # 0% coverage and the job failed on ``--cov-fail-under=85`` (measured: 63%).
    # The pin keeps the distro ABI and the test interpreter in step; bump it
    # together with the ``python-version`` below.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev xvfb \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1

      # PyGObject comes from the distribution (``python3-gi``) rather than a
      # source build: building it needs ``girepository-2.0``, which Ubuntu's
      # dev packages do not provide, so ``pip install PyGObject`` fails during
      # metadata generation. The interpreter is 3.12, matching the distro's
      # ``gi`` ABI; ``PYTHONPATH`` points the pytest run at Debian's
      # ``dist-packages`` so ``import gi`` resolves. The ``gui`` extra is not
      # installed, so pip never tries to build PyGObject.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install evdev

      - name: Pytest (GUI included in coverage)
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages xvfb-run -a python -m pytest tests/ -q \
            --cov=klyrshift --cov-config=coverage-gui.rc \
            --cov-report=term-missing --cov-fail-under=85

  package:
    name: Build .deb (downloadable artifact)
    # Pinned to 24.04 so the artifact this job uploads is byte-identical to the
    # one the release job publishes. The two jobs must build the same bytes:
    # the reproducible-build contract is "same tree -> same sha256", and the
    # toolchain is part of the tree's build environment. Verified: dpkg-deb
    # 1.22.6 (24.04) and 1.23.7 (26.04) both produce
    # 6c0a55ea... for v0.2.10, so pinning does not change the current artifact;
    # it removes the *risk* that a future image bump changes it silently. The
    # release job pins the same image, so the two stay in step.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      # Build the same ``.deb`` the release job publishes, so a reviewer can
      # install and test the exact artifact from the PR's Checks page without
      # cloning and building by hand. The version comes from ``pyproject.toml``.
      - name: Build .deb
        run: bash scripts/build_deb.sh

      # Enforce the reproducible-build contract in CI, not only by hand. The
      # contract is "same tree -> same sha256": the date comes from CHANGELOG.md
      # and the compressor is pinned (see build_deb.sh). Building a second time
      # from the same tree must reproduce the first artifact byte for byte; if it
      # does not, a published checksum would go stale on the next rebuild and the
      # contract is broken. This runs on the pinned 24.04 image, the same one the
      # release job uses, so a green check here predicts the published bytes.
      - name: Verify the build is byte-reproducible
        run: |
          set -euo pipefail
          first="$(sha256sum dist/klyrshift_*.deb | cut -d' ' -f1)"
          echo "first build:  ${first}"
          rm -rf dist build
          bash scripts/build_deb.sh >/dev/null
          second="$(sha256sum dist/klyrshift_*.deb | cut -d' ' -f1)"
          echo "second build: ${second}"
          if [ "${first}" != "${second}" ]; then
            echo "::error::the .deb is not reproducible: ${first} != ${second}"
            exit 1
          fi
          echo "reproducible: ${first}"

      - name: Write SHA256
        run: |
          cd dist
          sha256sum *.deb | tee SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ``dpkg-deb --build`` does not write DEBIAN/md5sums, so the build script
      # writes it. Assert it is present and covers every packaged file, or
      # ``dpkg --verify klyrshift`` would pass vacuously after install.
      - name: Verify the .deb ships a complete md5sums manifest
        run: |
          set -euo pipefail
          deb="$(ls dist/klyrshift_*.deb | head -1)"
          dpkg-deb --ctrl-tarfile "${deb}" | tar t | grep -qx './md5sums' \
            || { echo "::error::${deb} has no md5sums manifest"; exit 1; }
          dpkg-deb -e "${deb}" /tmp/ctrl
          dpkg-deb -x "${deb}" /tmp/root
          ( cd /tmp/root && find . -type f | sed 's|^\./||' | sort ) > /tmp/packaged.txt
          cut -c35- /tmp/ctrl/md5sums | sort > /tmp/listed.txt
          diff /tmp/packaged.txt /tmp/listed.txt \
            || { echo "::error::md5sums does not cover exactly the packaged files"; exit 1; }
          ( cd /tmp/root && md5sum -c --quiet /tmp/ctrl/md5sums )
          echo "md5sums covers all $(wc -l < /tmp/listed.txt) files."

      # A man page and a completion that never reach the package help nobody.
      # Assert the three generated files are present and that the man page is
      # compressed, which is what Debian Policy 12.1 requires (lintian reports
      # ``uncompressed-manual-page`` at error level otherwise).
      - name: Verify the .deb ships the man page and completions
        run: |
          set -euo pipefail
          deb="$(ls dist/klyrshift_*.deb | head -1)"
          dpkg-deb -c "${deb}" > /tmp/deb-contents.txt
          for path in \
            ./usr/share/man/man1/klyrshift.1.gz \
            ./usr/share/bash-completion/completions/klyrshift \
            ./usr/share/zsh/vendor-completions/_klyrshift
          do
            grep -q " ${path}\$" /tmp/deb-contents.txt \
              || { echo "::error::${deb} is missing ${path}"; exit 1; }
          done
          if grep -q " ./usr/share/man/man1/klyrshift.1\$" /tmp/deb-contents.txt; then
            echo "::error::the man page is not compressed"; exit 1
          fi
          echo "man page and completions are packaged."

      - name: Lint the package
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --fail-on error "$(ls dist/klyrshift_*.deb | head -1)"

      # ``dpkg`` honours the ``path-exclude`` rules in ``/etc/dpkg/dpkg.cfg.d``
      # and skips the matching files at unpack time. Ubuntu's runner excludes
      # ``/usr/share/man/*`` and ``/usr/share/doc/*``, so the packaged man page
      # and CHANGELOG are never written to disk even though the manifest lists
      # them. Install for real and assert ``klyrshift verify`` still passes: a
      # check that ignores the policy reports those two files as corruption and
      # fails every healthy Ubuntu install. This runs only on the ubuntu runner,
      # which is exactly the case that regressed.
      - name: Install the .deb and verify integrity under dpkg path-exclude
        run: |
          set -euo pipefail
          # Force the policy instead of trusting the runner's config, so the
          # guard reproduces the Ubuntu case (man pages and docs dropped) on any
          # image and proves the exclusion is really in effect before asserting.
          # Use the space-separated form real configs ship (``dpkg.cfg.d/docker``
          # and Ubuntu both write ``path-exclude /usr/share/man/*``); the ``=``
          # form is accepted by dpkg but hid a parser that only understood it.
          printf 'path-exclude /usr/share/man/*\npath-exclude /usr/share/doc/*\npath-include /usr/share/doc/*/copyright\npath-include /usr/share/doc/*/changelog.*\n' \
            | sudo tee /etc/dpkg/dpkg.cfg.d/zz-klyrshift-guard >/dev/null
          sudo apt-get install -y -qq "$(ls "$PWD"/dist/klyrshift_*.deb | head -1)"
          # The excluded files must really be absent, or the guard proves nothing.
          for gone in /usr/share/man/man1/klyrshift.1.gz /usr/share/doc/klyrshift/CHANGELOG.md; do
            [ -e "${gone}" ] && { echo "::error::${gone} was unpacked; the guard would not exercise the bug"; exit 1; }
          done
          klyrshift verify || { echo "::error::klyrshift verify failed on a healthy install"; exit 1; }
          klyrshift doctor || true
          sudo apt-get remove -y -qq klyrshift
          sudo rm -f /etc/dpkg/dpkg.cfg.d/zz-klyrshift-guard

      # Build every thematic archive in the same way the release job does, and
      # assert each contains the member ``dict install`` searches for. Without
      # this a renamed category file would only fail at release time.
      - name: Build thematic dictionary archives
        run: bash scripts/build_dict_archives.sh dist/dict-archives

      - name: Verify thematic archives are usable
        run: |
          set -euo pipefail
          for archive in dist/dict-archives/klyrshift-dict-*.tar.gz; do
            slug="$(basename "${archive}" | sed -E 's/^klyrshift-dict-(.*)\.tar\.gz$/\1/')"
            for lang in ru en; do
              member="${lang}-${slug}-1k.txt"
              if ! tar -tzf "${archive}" | grep -q "/${member}$"; then
                echo "::error::${archive} is missing ${member}"
                exit 1
              fi
            done
          done
          echo "All thematic archives contain their ru/en members."

      - name: Upload .deb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: klyrshift-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS.txt
          if-no-files-found: error

  latency-budget:
    name: Detector latency & memory budget
    # ubuntu-latest on purpose (see the runner policy above).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # The thresholds are loose on purpose: a shared runner is noisy, and the
      # regression this guards against is an order-of-magnitude one (a corpus
      # reloaded per word, an accidental O(n^2)), not a few percent.
      - name: Measure
        run: |
          python scripts/measure_latency.py \
            --limit 3000 --repeats 3 --budget-ms 0.5 --budget-mib 64

  qa:
    name: Autonomous QA (deterministic, offline)
    # ubuntu-latest on purpose (see the runner policy above).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install evdev

      # The deterministic QA engine: the curated corpus plus a fixed batch of
      # generated scenarios, run through the real daemon with the simulator. It
      # needs no API key and no network, so it runs on every push and PR. The
      # exit code is non-zero only on a real failure or a broken scenario.
      - name: Run the QA engine
        run: |
          klyrshift qa run --generate 60 --seed 12345 --no-record --report qa-out

      - name: Upload the QA report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: klyrshift-qa-report
          path: qa-out/
          if-no-files-found: warn

  site:
    name: Landing page build
    # ubuntu-latest on purpose (see the runner policy above): Node is pinned by
    # ``setup-node``, so the image only has to provide a shell.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build
